<h1>Taha Mahmoudi Khorsand</h1><p>WordPress · SEO · Digital Marketing<br/>طراحی سایت · سئو · دیجیتال مارکتینگ</p>
<nav aria-label="Language"><a href="fa/" hreflang="fa" lang="fa">فارسی</a><a href="ar/" hreflang="ar" lang="ar">العربية</a><a href="en/" hreflang="en" lang="en">English</a></nav>
<small id="status">Redirecting to your language…</small></main>
<script>
(function(){
var L={fa:'fa/',en:'en/',ar:'ar/'},done=false;
var AR='SA AE EG IQ JO KW LB OM QA BH SY YE LY TN DZ MA SD PS MR SO DJ KM'.split(' ');
function go(l){if(done)return;done=true;location.replace(L[l]+location.search+location.hash)}
function pick(cc){cc=(cc||'').toUpperCase();return cc==='IR'?'fa':AR.indexOf(cc)>-1?'ar':'en'}
function stored(){try{var v=localStorage.getItem('tmk_locale');if(L[v])return v}catch(e){}var m=document.cookie.match(/(?:^|; )tmk_locale=(fa|ar|en)/);return m?m[1]:null}
function byBrowser(){var ls=navigator.languages||[navigator.language||''];for(var i=0;i<ls.length;i++){var x=String(ls[i]).toLowerCase();if(x.indexOf('fa')===0)return'fa';if(x.indexOf('ar')===0)return'ar';if(x.indexOf('en')===0)return'en'}
try{if(Intl.DateTimeFormat().resolvedOptions().timeZone==='Asia/Tehran')return'fa'}catch(e){}return'en'}
function get(u,t){var c=new AbortController(),id=setTimeout(function(){c.abort()},t);return fetch(u,{signal:c.signal,cache:'no-store'}).then(function(r){clearTimeout(id);if(!r.ok)throw 0;return r.text()})}
var p=stored();if(p)return go(p);
try{var c=JSON.parse(localStorage.getItem('tmk_geo')||'null');if(c&&c.cc&&Date.now()-c.t<6048e5)return go(pick(c.cc))}catch(e){}
setTimeout(function(){go(byBrowser())},3200);
get('https://get.geojs.io/v1/ip/country.json',2200).then(function(t){return JSON.parse(t).country})
.catch(function(){return get('https://ipapi.co/country/',1800).then(function(t){return t.trim()})})
.then(function(cc){if(!/^[A-Za-z]{2}$/.test(cc||''))throw 0;try{localStorage.setItem('tmk_geo',JSON.stringify({cc:cc,t:Date.now()}))}catch(e){}go(pick(cc))})
.catch(function(){go(byBrowser())});
})();
</script><noscript><style>#status{display:none}</style></noscript></body></html>
